<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กราฟเส้นตรง - MathGraph</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html">MathGraph</a>
            <button class="btn btn-outline-secondary btn-sm" onclick="location.href='index.html'">ย้อนกลับ</button>
        </div>
    </nav>

    <div class="container">
        <div class="row g-4">
            <div class="col-lg-7">
                <div class="canvas-card">
                    <canvas id="linearGraph" width="550" height="550"></canvas>
                    <div class="zoom-overlay">
                        <button id="zoomIn" class="btn-zoom">+</button>
                        <button id="zoomOut" class="btn-zoom">−</button>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="control-panel">
                    <h4 class="fw-bold mb-4">ฟังก์ชันเชิงเส้น (Linear)</h4>
                    <div class="equation-display">
                        y = <span id="mVal">1</span>x + <span id="kVal">0</span>
                    </div>

                    <div class="mb-4">
    <label class="form-label d-flex justify-content-between">ค่า a</label>
    <input type="range" class="form-range" id="mInput" min="-5" max="5" step="0.1" value="1">
</div>

<div class="mb-4">
    <label class="form-label d-flex justify-content-between">ค่า b</label>
    <input type="range" class="form-range" id="kInput" min="-5" max="5" step="0.1" value="0">
</div>

                </div>
            </div>
        </div>
    </div>

    <script src="linear-script.js"></script>
</body>
</html>
